naftiko: "1.0.0-alpha1"

info:
  label: Amazon QLDB API
  description: Fully managed ledger database API for immutable, transparent, and cryptographically verifiable transaction logs. Covers ledger management, journal streams, and PartiQL-based data operations.
  tags:
    - Amazon
    - AWS
    - Database
    - Ledger
    - Immutable
    - Blockchain
    - Audit
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - type: http
      namespace: amazon-qldb
      baseUri: https://qldb.{region}.amazonaws.com
      description: Amazon QLDB ledger database management API
      authentication:
        type: apikey
        key: Authorization
        value: "{{AWS_ACCESS_KEY_ID}}"
        placement: header
      resources:
        - name: ledgers
          path: /ledgers
          description: Manage QLDB ledger databases
          operations:
            - name: list-ledgers
              method: GET
              description: List all ledgers in the account
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-ledger
              method: POST
              description: Create a new QLDB ledger
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  Name: "{{tools.name}}"
                  PermissionsMode: "{{tools.permissions_mode}}"

        - name: ledger
          path: /ledgers/{name}
          description: Individual ledger operations
          operations:
            - name: describe-ledger
              method: GET
              description: Get details of a QLDB ledger
              inputParameters:
                - name: name
                  in: path
                  type: string
                  required: true
                  description: Name of the ledger
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: journal-s3-exports
          path: /ledgers/{name}/journal-s3-exports
          description: Export journal to S3
          operations:
            - name: list-journal-s3-exports
              method: GET
              description: List journal S3 exports for a ledger
              inputParameters:
                - name: name
                  in: path
                  type: string
                  required: true
                  description: Name of the ledger
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: export-journal-to-s3
              method: POST
              description: Export journal contents to an S3 bucket
              inputParameters:
                - name: name
                  in: path
                  type: string
                  required: true
                  description: Name of the ledger
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  InclusiveStartTime: "{{tools.start_time}}"
                  ExclusiveEndTime: "{{tools.end_time}}"
                  S3ExportConfiguration: "{{tools.s3_config}}"
                  RoleArn: "{{tools.role_arn}}"

        - name: journal-kinesis-streams
          path: /ledgers/{name}/journal-kinesis-streams
          description: Stream journal to Kinesis
          operations:
            - name: list-journal-kinesis-streams
              method: GET
              description: List journal Kinesis streams for a ledger
              inputParameters:
                - name: name
                  in: path
                  type: string
                  required: true
                  description: Name of the ledger
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: stream-journal-to-kinesis
              method: POST
              description: Stream journal contents to a Kinesis Data Streams resource
              inputParameters:
                - name: name
                  in: path
                  type: string
                  required: true
                  description: Name of the ledger
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  InclusiveStartTime: "{{tools.start_time}}"
                  RoleArn: "{{tools.role_arn}}"
                  KinesisConfiguration: "{{tools.kinesis_config}}"
                  StreamName: "{{tools.stream_name}}"

  exposes:
    - type: rest
      port: 8100
      namespace: amazon-qldb-rest
      resources:
        - path: /v1/ledgers
          name: ledgers
          operations:
            - method: GET
              name: list-ledgers
              description: List all QLDB ledgers
              call: "amazon-qldb.list-ledgers"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-ledger
              description: Create a new ledger
              call: "amazon-qldb.create-ledger"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: amazon-qldb-mcp
      transport: http
      tools:
        - name: list-ledgers
          description: List all QLDB ledger databases in the account
          hints:
            readOnly: true
            openWorld: true
          call: "amazon-qldb.list-ledgers"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-ledger
          description: Create a new immutable QLDB ledger database
          hints:
            readOnly: false
            destructive: false
          call: "amazon-qldb.create-ledger"
          with:
            name: "tools.name"
          outputParameters:
            - type: object
              mapping: "$."

        - name: describe-ledger
          description: Get details of a QLDB ledger including status and digest
          hints:
            readOnly: true
            openWorld: false
          call: "amazon-qldb.describe-ledger"
          with:
            name: "tools.ledger_name"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-journal-s3-exports
          description: List journal export jobs for a ledger
          hints:
            readOnly: true
            openWorld: true
          call: "amazon-qldb.list-journal-s3-exports"
          with:
            name: "tools.ledger_name"
          outputParameters:
            - type: object
              mapping: "$."

        - name: export-journal-to-s3
          description: Export ledger journal contents to an S3 bucket for auditing
          hints:
            readOnly: false
            destructive: false
          call: "amazon-qldb.export-journal-to-s3"
          with:
            name: "tools.ledger_name"
          outputParameters:
            - type: object
              mapping: "$."

        - name: stream-journal-to-kinesis
          description: Stream ledger journal contents to Kinesis Data Streams
          hints:
            readOnly: false
            destructive: false
          call: "amazon-qldb.stream-journal-to-kinesis"
          with:
            name: "tools.ledger_name"
          outputParameters:
            - type: object
              mapping: "$."
