name: Amazon QLDB
description: Amazon Quantum Ledger Database (QLDB) is a fully managed ledger database that provides a transparent, immutable,
  and cryptographically verifiable transaction log. QLDB tracks each and every application data change and maintains a complete
  and verifiable history of changes over time, making it ideal for systems of record where data integrity and auditability
  are critical.
