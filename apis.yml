apis:
- name: Amazon QLDB API
  description: >-
    The Amazon QLDB API provides programmatic access to manage ledger databases
    with immutable, transparent, and cryptographically verifiable transaction
    logs. It enables developers to create and manage ledgers, submit PartiQL
    statements, stream journal data, and export ledger blocks for verification
    and auditing purposes.
